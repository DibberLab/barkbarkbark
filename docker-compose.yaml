services:
  app:
    build: .
    container_name: "void-app"
    restart: unless-stopped
    ports:
      - "1119:3000"
    environment:
      DATABASE_URL: postgresql://void:${DB_PASSWORD}@postgres:5432/void
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: https://barkbarkbark.dibberlab.me
      UPLOAD_DIR: /app/uploads
    volumes:
      - ./data/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - void-net

  postgres:
    image: postgres:16-alpine
    container_name: "void-postgres"
    restart: unless-stopped
    environment:
      POSTGRES_USER: void
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: void
    volumes:
      - ./data/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U void"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - void-net

networks:
  void-net:
    internal: false
